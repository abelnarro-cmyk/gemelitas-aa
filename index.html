<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GEMELITAS A&A S.A.C.</title>
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--bg:#07111f;
--bg2:#0b1627;
--card:#101d30;
--card2:#15243a;
--line:#263c58;
--text:#f4f7fb;
--muted:#91a4ba;
--accent:#39d98a;
--accent2:#6d8cff;
--red:#ff6b7a;
--gold:#f7ba55;
--shadow:0 18px 45px rgba(0,0,0,.28);
--radius:20px;
--fs:16px
}

body[data-theme=light]{
--bg:#edf3f9;
--bg2:#e6edf6;
--card:#fff;
--card2:#f4f7fb;
--line:#d9e2ee;
--text:#172033;
--muted:#6d7a8c;
--shadow:0 15px 35px rgba(32,50,75,.1)
}

body[data-theme=violet]{
--bg:#100d1f;
--bg2:#19132d;
--card:#201a35;
--card2:#292143;
--line:#403661;
--accent:#b596ff;
--accent2:#6fe6ff
}

*{box-sizing:border-box}

html{font-size:var(--fs)}

body{
margin:0;
background:radial-gradient(circle at 10% 0,var(--bg2),var(--bg) 55%);
color:var(--text);
font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
min-height:100vh
}

.app{
max-width:1380px;
margin:auto;
padding:16px 16px 80px
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px
}

.brand{
display:flex;
align-items:center;
gap:12px
}

.logo{
width:50px;
height:50px;
border-radius:16px;
background:linear-gradient(135deg,var(--accent),var(--accent2));
display:grid;
place-items:center;
font-size:24px
}

h1{
margin:0;
font-size:1.25rem
}

.sub{
color:var(--muted);
font-size:.78rem;
margin-top:3px
}

.nav{
display:flex;
gap:7px;
overflow:auto;
padding:16px 0 10px
}

.nav button,.btn{
border:0;
border-radius:12px;
padding:10px 14px;
font:inherit;
font-weight:800;
cursor:pointer
}

.nav button{
background:var(--card);
color:var(--muted);
border:1px solid var(--line);
white-space:nowrap
}

.nav button.active{
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:#06111e
}

.btn{
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:#06111e
}

.btn.secondary{
background:var(--card2);
color:var(--text);
border:1px solid var(--line)
}

.btn.red{
background:var(--red);
color:#fff
}

.btn.small{
padding:7px 10px;
font-size:.78rem
}

.grid{
display:grid;
gap:12px
}

.kpis{
grid-template-columns:repeat(6,1fr)
}

.card{
background:linear-gradient(145deg,var(--card),var(--card2));
border:1px solid var(--line);
border-radius:var(--radius);
padding:16px;
box-shadow:var(--shadow)
}

.kpi{
min-height:112px
}

.kpi label{
display:block;
color:var(--muted);
font-size:.68rem;
text-transform:uppercase;
font-weight:900
}

.kpi strong{
display:block;
font-size:1.3rem;
margin-top:12px
}

.kpi small{
display:block;
color:var(--muted);
margin-top:5px
}

.hero{
background:linear-gradient(120deg,var(--card),var(--card2))
}

.section{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin:16px 0 10px
}

.section h2{
font-size:1.05rem;
margin:0
}

.two{
grid-template-columns:1.2fr .8fr
}

.chart{
height:280px
}

.form{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px
}

.field label{
display:block;
font-size:.68rem;
color:var(--muted);
font-weight:900;
text-transform:uppercase;
margin-bottom:5px
}

input,select,textarea{
width:100%;
background:var(--bg);
color:var(--text);
border:1px solid var(--line);
border-radius:10px;
padding:10px;
font:inherit
}

textarea{
min-height:75px
}

.row{
display:flex;
gap:8px;
align-items:center;
flex-wrap:wrap
}

.tablewrap{
overflow:auto
}

table{
width:100%;
border-collapse:collapse;
min-width:650px
}

th,td{
padding:9px;
border-bottom:1px solid var(--line);
text-align:left
}

th{
font-size:.68rem;
text-transform:uppercase;
color:var(--muted)
}

.item{
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
background:var(--bg);
border:1px solid var(--line);
padding:11px;
border-radius:13px;
margin-bottom:8px
}

.item small{
display:block;
color:var(--muted);
margin-top:4px
}

.actions{
display:flex;
gap:6px;
flex-wrap:wrap
}

.empty{
text-align:center;
color:var(--muted);
padding:30px
}

.pill{
padding:4px 9px;
border-radius:99px;
background:color-mix(in srgb,var(--accent) 15%,transparent);
color:var(--accent);
font-size:.72rem;
font-weight:900
}

.notice{
padding:11px;
border-left:4px solid var(--gold);
background:color-mix(in srgb,var(--gold) 8%,transparent);
border-radius:9px;
color:var(--muted)
}

.settings-grid{
grid-template-columns:repeat(3,1fr)
}

.undo{
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
background:var(--card);
border:1px solid var(--line);
padding:10px 13px;
border-radius:13px;
box-shadow:var(--shadow);
display:none;
z-index:20
}

.undo.show{
display:flex;
gap:10px;
align-items:center
}

.sync{
font-size:.74rem;
color:var(--muted)
}

.sync.ok{
color:var(--accent)
}

.sync.bad{
color:var(--red)
}

.companyBar{
display:flex;
gap:8px;
align-items:center;
flex-wrap:wrap;
margin-top:10px
}

.companyBar select{
max-width:340px
}

.login{
position:fixed;
inset:0;
z-index:9999;
background:#07111f;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.loginBox{
width:100%;
max-width:410px;
background:#101d32;
border:1px solid #263b58;
border-radius:20px;
padding:28px
}

.login input{
margin:7px 0;
padding:13px
}

.login button{
width:100%;
margin-top:10px;
padding:13px
}

.statusdot{
display:inline-block;
width:8px;
height:8px;
border-radius:50%;
background:var(--accent);
margin-right:5px
}

@media(max-width:1000px){
.kpis{
grid-template-columns:repeat(3,1fr)
}

.two{
grid-template-columns:1fr
}

.form{
grid-template-columns:repeat(3,1fr)
}
}

@media(max-width:620px){
.app{
padding:11px 9px 80px
}

.top{
align-items:flex-start
}

.kpis{
grid-template-columns:1fr 1fr
}

.form,.settings-grid{
grid-template-columns:1fr
}

.chart{
height:235px
}

.item{
align-items:flex-start;
flex-direction:column
}

.actions{
width:100%
}

.companyBar select{
max-width:none
}
}

/* ===== GEMELITAS A&A — identidad visual profesional ===== */
.login{
  background:
    radial-gradient(circle at 15% 15%, rgba(247,186,85,.20), transparent 32%),
    radial-gradient(circle at 85% 85%, rgba(57,217,138,.12), transparent 30%),
    linear-gradient(135deg,#050b14,#0b1627 58%,#111827);
}
.loginBox{
  max-width:980px;
  padding:0;
  overflow:hidden;
  display:grid;
  grid-template-columns:1.08fr .92fr;
  background:rgba(16,29,48,.96);
  box-shadow:0 30px 80px rgba(0,0,0,.45);
}
.loginBrand{
  min-height:560px;
  padding:42px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 25%,rgba(247,186,85,.16),transparent 38%),
    linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,0));
  border-right:1px solid #263b58;
}
.loginLogo{
  width:min(390px,78%);
  max-height:330px;
  object-fit:contain;
  filter:drop-shadow(0 18px 25px rgba(0,0,0,.25));
}
.loginBrand h2{
  margin:20px 0 6px;
  font-size:1.45rem;
}
.loginBrand p{
  margin:0;
  color:#aebdd0;
  font-size:.9rem;
}
.loginForm{
  padding:46px 40px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.loginKicker{
  color:var(--accent);
  font-size:.72rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.12em;
}
.loginForm h2{
  margin:7px 0 4px;
  font-size:1.65rem;
  color:#ffffff;
  letter-spacing:-.02em;
}
.loginForm .loginSub{
  color:#c3d0df;
  margin:0 0 20px;
  font-size:.9rem;
  line-height:1.5;
}
.loginForm .field-label{
  display:block;
  margin:10px 0 5px;
  color:#e8eef6;
  font-size:.78rem;
  font-weight:900;
}
.loginForm input{
  margin:0 0 7px;
  padding:13px 14px;
  background:#081321;
  color:#ffffff;
  border:1px solid #3a5270;
  outline:none;
}
.loginForm input::placeholder{
  color:#9fb0c4;
  opacity:1;
}
.loginForm input:focus{
  border-color:#6d8cff;
  box-shadow:0 0 0 3px rgba(109,140,255,.18);
}
.loginForm .btn{
  margin-top:14px;
  padding:13px;
}
.loginMessage{
  min-height:24px;
  margin:12px 0 0;
  color:#ffd166;
  font-size:.82rem;
  line-height:1.45;
}
.loginMessage.error{color:#ff9eaa}
.loginMessage.ok{color:#70e6a8}
.loginBusy{opacity:.7;pointer-events:none}
.topLogo{
  width:54px;
  height:54px;
  padding:5px;
  border-radius:16px;
  object-fit:contain;
  background:#fff;
  box-shadow:0 8px 22px rgba(0,0,0,.18);
}
.headerBrandText{
  display:flex;
  flex-direction:column;
}
.dashboardHeroBrand{
  display:flex;
  align-items:center;
  gap:14px;
}
.dashboardHeroBrand img{
  width:72px;
  height:72px;
  padding:6px;
  border-radius:20px;
  object-fit:contain;
  background:#fff;
  box-shadow:0 12px 25px rgba(0,0,0,.18);
}
@media(max-width:760px){
  .loginBox{
    grid-template-columns:1fr;
    max-width:460px;
  }
  .loginBrand{
    min-height:300px;
    padding:28px 22px 20px;
    border-right:0;
    border-bottom:1px solid #263b58;
  }
  .loginLogo{
    width:min(270px,75%);
    max-height:190px;
  }
  .loginBrand h2{font-size:1.2rem;margin-top:12px}
  .loginForm{padding:30px 24px}
}


/* ===== Interacción y experiencia profesional ===== */
button,.btn,.nav button{transition:transform .12s ease,box-shadow .18s ease,filter .18s ease,background .18s ease}
button:hover,.btn:hover,.nav button:hover{filter:brightness(1.05);box-shadow:0 8px 20px rgba(0,0,0,.14)}
button:active,.btn:active,.nav button:active{transform:translateY(1px) scale(.975);box-shadow:0 3px 9px rgba(0,0,0,.12)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none;box-shadow:none;transform:none}
.ripple{position:relative;overflow:hidden}
.ripple::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);pointer-events:none}
.ripple.ripple-go::after{animation:ripple .42s ease-out}
@keyframes ripple{to{transform:scale(22);opacity:0}}
.savePulse{animation:savePulse .65s ease}
@keyframes savePulse{50%{transform:scale(1.03)}}
.session-grid{display:grid;gap:9px}
.session-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.session-main{min-width:0}
.session-title{font-weight:900}
.session-meta{color:var(--muted);font-size:.76rem;margin-top:4px;line-height:1.4}
.session-current{color:var(--accent);font-weight:900;font-size:.72rem}
.session-revoked{color:var(--red);font-weight:900;font-size:.72rem}
.session-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:620px){.session-item{align-items:flex-start;flex-direction:column}.session-actions{width:100%;justify-content:flex-start}}


.week-picker{display:flex;align-items:center;gap:7px;min-width:210px}
.week-picker label{font-size:.72rem;font-weight:900;text-transform:uppercase;color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.week-picker select{min-width:210px}
.week-header,.week-module-header{gap:12px}
.week-header-actions{align-items:flex-end}
@media(max-width:620px){
.week-header,.week-module-header{align-items:stretch;flex-direction:column}
.week-header-actions{width:100%;align-items:stretch}
.week-picker{width:100%;min-width:0}
.week-picker select{width:100%;min-width:0}
.week-header-actions .btn{white-space:nowrap}
}

.chart-large{min-height:360px}
.chart-empty{display:flex;align-items:center;justify-content:center;min-height:260px}
.chart-empty-message{margin-top:8px}
@media(max-width:700px){
.chart-large{min-height:280px}
}

</style>
</head>

img.src=companySrc;
});
document.querySelectorAll('[data-gemelitas-logo]').forEach(img=>{
img.src=gemelitasSrc;
});
}

function resizeCompanyImage(file){
return new Promise((resolve,reject)=>{
if(!file || !file.type.startsWith('image/')){
reject(new Error('Archivo no válido'));
return;
}
if(file.size>6*1024*1024){
reject(new Error('La imagen supera 6 MB'));
return;
}
const reader=new FileReader();
reader.onerror=()=>reject(new Error('No se pudo leer la imagen'));
reader.onload=()=>{
const img=new Image();
img.onerror=()=>reject(new Error('No se pudo abrir la imagen'));
img.onload=()=>{
const max=700;
const scale=Math.min(1,max/Math.max(img.width,img.height));
const w=Math.max(1,Math.round(img.width*scale));
const h=Math.max(1,Math.round(img.height*scale));
const canvas=document.createElement('canvas');
canvas.width=w;
canvas.height=h;
const ctx=canvas.getContext('2d');
ctx.fillStyle='#ffffff';
ctx.fillRect(0,0,w,h);
ctx.drawImage(img,0,0,w,h);
let out=canvas.toDataURL('image/webp',0.82);
if(!out.startsWith('data:image/webp')) out=canvas.toDataURL('image/jpeg',0.84);
if(out.length>450000){
out=canvas.toDataURL(out.startsWith('data:image/webp')?'image/webp':'image/jpeg',0.60);
}
resolve(out);
};
img.src=reader.result;
};
reader.readAsDataURL(file);
});
}

async function changeCompanyLogo(input){
const file=input?.files?.[0];
if(!file)return;
try{
const data=await resizeCompanyImage(file);
state.settings.logo=data;
queueSync();
render();
}catch(e){
console.error(e);
alert(e.message||'No se pudo cambiar la imagen.');
}
if(input) input.value='';
}

function resetCompanyLogo(){
if(!confirm('¿Restaurar el logo original de GEMELITAS A&A S.A.C. para esta empresa?')) return;
delete state.settings.logo;
queueSync();
render();
}

let startupPromise=null;


function cacheKeyFor(companyId){
return String(currentUser?.id||'anonymous')+'::'+String(companyId||'');
}

function openCacheDb(){
if(cacheDbPromise)return cacheDbPromise;
cacheDbPromise=new Promise((resolve,reject)=>{
try{
if(!('indexedDB' in window)){reject(new Error('IndexedDB no disponible'));return;}
const req=indexedDB.open(CACHE_DB_NAME,1);
req.onupgradeneeded=()=>{
const db=req.result;
if(!db.objectStoreNames.contains(CACHE_STORE)){
db.createObjectStore(CACHE_STORE,{keyPath:'key'});
}
};
req.onsuccess=()=>resolve(req.result);
req.onerror=()=>reject(req.error||new Error('No se pudo abrir la caché local'));
}catch(e){reject(e);}
});
return cacheDbPromise;
}

async function readIndexedCache(companyId){
try{
const db=await openCacheDb();
return await new Promise((resolve,reject)=>{
const tx=db.transaction(CACHE_STORE,'readonly');
const req=tx.objectStore(CACHE_STORE).get(cacheKeyFor(companyId));
req.onsuccess=()=>resolve(req.result?.data||null);
req.onerror=()=>reject(req.error);
});
}catch(e){
console.warn('No se pudo leer la caché IndexedDB:',e);
return null;
}
}

async function writeIndexedCache(companyId,data){
try{
const db=await openCacheDb();
await new Promise((resolve,reject)=>{
const tx=db.transaction(CACHE_STORE,'readwrite');
tx.objectStore(CACHE_STORE).put({
key:cacheKeyFor(companyId),
updatedAt:new Date().toISOString(),
data:structuredClone(data)
});
tx.oncomplete=resolve;
tx.onerror=()=>reject(tx.error);
});
return true;
}catch(e){
console.warn('No se pudo guardar la caché IndexedDB:',e);
return false;
}
}

async function removeIndexedCache(companyId){
try{
const db=await openCacheDb();
await new Promise((resolve,reject)=>{
const tx=db.transaction(CACHE_STORE,'readwrite');
tx.objectStore(CACHE_STORE).delete(cacheKeyFor(companyId));
tx.oncomplete=resolve;
tx.onerror=()=>reject(tx.error);
});
}catch(e){console.warn('No se pudo borrar la caché IndexedDB:',e);}
}

async function migrateLegacyCaches(){
/* La versión anterior guardaba todo el negocio en localStorage.
   Eso podía llenar la cuota del navegador y terminar afectando incluso
   al almacenamiento que Supabase Auth usa para mantener la sesión.
   Migramos esos datos a IndexedDB y liberamos localStorage. */
try{
if(!('indexedDB' in window))return;
const keys=[];
for(let i=0;i<localStorage.length;i++){
const key=localStorage.key(i);
if(key&&key.startsWith('gemelitas_cache_'))keys.push(key);
}
for(const key of keys){
try{
const raw=localStorage.getItem(key);
if(!raw)continue;
const data=JSON.parse(raw);
const companyId=key.slice('gemelitas_cache_'.length);
const db=await openCacheDb();
await new Promise((resolve,reject)=>{
const tx=db.transaction(CACHE_STORE,'readwrite');
tx.objectStore(CACHE_STORE).put({
key:'legacy::'+companyId,
updatedAt:new Date().toISOString(),
data
});
tx.oncomplete=resolve;
tx.onerror=()=>reject(tx.error);
});
localStorage.removeItem(key);
}catch(e){
console.warn('No se pudo migrar una caché antigua:',e);
}
}
}catch(e){
console.warn('No se pudo completar la migración de caché:',e);
}
}

async function readLocalCache(companyId){
const modern=await readIndexedCache(companyId);
if(modern)return modern;

/* Recuperación de caché antigua migrada. Solo se usa como respaldo
   cuando el servidor no está disponible; el servidor sigue siendo la
   fuente principal de verdad. */
try{
const db=await openCacheDb();
const legacy=await new Promise((resolve,reject)=>{
const tx=db.transaction(CACHE_STORE,'readonly');
const req=tx.objectStore(CACHE_STORE).get('legacy::'+String(companyId));
req.onsuccess=()=>resolve(req.result?.data||null);
req.onerror=()=>reject(req.error);
});
if(legacy)return legacy;
}catch(e){}

try{
const raw=localStorage.getItem('gemelitas_cache_'+companyId);
return raw?JSON.parse(raw):null;
}catch(e){return null;}
}

function playClickSound(force=false){
if(!force&&!getSoundEnabled())return;
try{
if(!soundContext) soundContext=new (window.AudioContext||window.webkitAudioContext)();
if(soundContext.state==='suspended') soundContext.resume();
const o=soundContext.createOscillator();
const g=soundContext.createGain();
o.type='sine';
o.frequency.value=620;
g.gain.setValueAtTime(.0001,soundContext.currentTime);
g.gain.exponentialRampToValueAtTime(.035,soundContext.currentTime+.008);
g.gain.exponentialRampToValueAtTime(.0001,soundContext.currentTime+.055);
o.connect(g);g.connect(soundContext.destination);
o.start();o.stop(soundContext.currentTime+.06);
}catch(e){}
}

function deviceInfo(){
const ua=navigator.userAgent||'';
let os='Dispositivo';
if(/Windows/i.test(ua))os='Windows';
else if(/Android/i.test(ua))os='Android';
else if(/iPhone|iPad|iPod/i.test(ua))os='iOS';
else if(/Mac OS X/i.test(ua))os='macOS';
else if(/Linux/i.test(ua))os='Linux';
let browser='Navegador';
if(/Edg\//i.test(ua))browser='Edge';
else if(/Chrome\//i.test(ua)&&!/Edg\//i.test(ua))browser='Chrome';
else if(/Firefox\//i.test(ua))browser='Firefox';
else if(/Safari\//i.test(ua)&&!/Chrome\//i.test(ua))browser='Safari';
const type=/Mobi|Android/i.test(ua)?'Móvil':'Computadora';
return {os,browser,type,name:`${browser} · ${os}`};
}

function jwtClaim(token,key){
try{
const part=String(token||'').split('.')[1];
if(!part)return null;
const json=JSON.parse(atob(part.replace(/-/g,'+').replace(/_/g,'/')));
return json?.[key]??null;
}catch(e){return null;}
}

function sessionIdFrom(session){
return String(
session?.user?.session_id||
session?.session_id||
jwtClaim(session?.access_token,'session_id')||
''
);
}

function formatSessionDate(v){
if(!v)return 'Sin fecha';
try{
const d=new Date(v);
if(Number.isNaN(d.getTime()))return 'Fecha no disponible';
return d.toLocaleString('es-PE',{dateStyle:'medium',timeStyle:'short'});
}catch(e){
return 'Fecha no disponible';
}
}

function groupedDeviceSessions(){
const groups=new Map();
for(const x of (deviceSessions||[])){
const key=String(x.device_id||x.device_name||x.browser||'dispositivo').trim().toLowerCase();
if(!groups.has(key))groups.set(key,[]);
groups.get(key).push(x);
}
return [...groups.values()].map(list=>{
list.sort((a,b)=>String(b.last_seen_at||b.updated_at||b.created_at||'').localeCompare(String(a.last_seen_at||a.updated_at||a.created_at||'')));
const current=list.some(x=>String(x.session_id)===String(currentSessionId));
const active=list.some(x=>Boolean(x.active)&&!x.revoked_at);
return {
...list[0],
_sessions:list,
current,
active
};
}).sort((a,b)=>{
if(a.current&&!b.current)return -1;
if(!a.current&&b.current)return 1;
return String(b.last_seen_at||'').localeCompare(String(a.last_seen_at||''));
});
}

function parseDateSafe(value){
if(value instanceof Date){
if(!Number.isNaN(value.getTime()))return new Date(value.getTime());
return null;
}

if(value===null||value===undefined)return null;

const raw=String(value).trim();
if(!raw)return null;

let candidate=null;

/* Formato seguro principal: YYYY-MM-DD. */
if(/^\d{4}-\d{2}-\d{2}$/.test(raw)){
candidate=new Date(raw+'T12:00:00');
}

/* Compatibilidad con fechas antiguas DD/MM/YYYY. */
if(!candidate||Number.isNaN(candidate.getTime())){
const m=raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
if(m){
const dd=Number(m[1]);
const mm=Number(m[2]);
const yy=Number(m[3]);
candidate=new Date(`${String(yy).padStart(4,'0')}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}T12:00:00`);
}
}

/* Compatibilidad con ISO u otros valores válidos ya guardados. */
if(!candidate||Number.isNaN(candidate.getTime())){
candidate=new Date(raw);
}

if(!candidate||Number.isNaN(candidate.getTime()))return null;
return candidate;
}

function weekForDate(d){
const x=parseDateSafe(d);
if(!x)return null;

const day=x.getDay();
const diff=day===0?-6:1-day;

x.setDate(x.getDate()+diff);

return x.toISOString().slice(0,10);
}

function ensureWeek(
start=weekForDate(today())
){

if(!start)start=weekForDate(today());

let w=
state.weeks.find(
x=>x&&x.start===start
);

if(!w){

w={
id:uid(),
label:'Semana '+(state.weeks.length+1),
start,
price:7,
days:Object.fromEntries(
DAYS.map(d=>[d,0])
)
};

state.weeks.push(w);

saveLocal();

}

return w;

}

function selectedWeek(){

const requested=state.currentWeek||weekForDate(today());
const w=ensureWeek(requested);

if(state.currentWeek!==w.start){
state.currentWeek=w.start;
}

return w;

}

function weekTotal(w){

return DAYS.reduce(
(s,d)=>
s+
n(w.days?.[d])*
n(w.price),
0
);

}

function extrasForWeek(w){

return state.sales
.filter(
x=>weekForDate(x.date)===w.start
)
.reduce(
(s,x)=>
s+n(x.qty)*n(x.price),
0
);

}

function expensesForWeek(
w,
type='business'
){

return state.expenses
.filter(
x=>
weekForDate(x.date)===w.start &&
x.type===type
)
.reduce(
(s,x)=>s+n(x.amount),
0
);

}

function incomeForWeek(w){

return state.income
.filter(
x=>
x.weekId===w.id ||
weekForDate(x.date)===w.start
)
.reduce(
(s,x)=>s+n(x.amount),
0
);

}

function salesTotal(w){

return weekTotal(w)+
extrasForWeek(w);

}

function pendingWeek(w){

return Math.max(
0,
salesTotal(w)-
incomeForWeek(w)
);

}

function rangeWeeks(){

let a=
[...state.weeks]
.sort(
(a,b)=>
a.start.localeCompare(b.start)
);

if(state.period==='semana')
return a.slice(-1);

if(state.period==='mes'){

const m=today().slice(0,7);

return a.filter(
w=>w.start.slice(0,7)===m
);

}

if(state.period==='anio'){

const y=today().slice(0,4);

return a.filter(
w=>w.start.slice(0,4)===y
);

}

return a;

}

async function refreshGlobalMetrics(){

if(!currentUser)
return;

globalLoading=true;

globalMetrics=[];

try{

const ids=await getMemberships();

for(const id of ids){

const c=companies.find(x=>x.id===id);

const {data,error}=await sb
.from('company_app_data')
.select('data,updated_at')
.eq('company_id',id)
.maybeSingle();

if(error)
throw error;

const d=data?.data||null;

if(!d){

globalMetrics.push({
id,
name:c?.name||'Empresa',
sales:0,income:0,expenses:0,personal:0,profit:0,cash:0,weekly:{},expenseCategories:{}
});
continue;
}

const weeks=Array.isArray(d.weeks)?d.weeks:[];
const sales=Array.isArray(d.sales)?d.sales:[];
const income=Array.isArray(d.income)?d.income:[];
const expenses=Array.isArray(d.expenses)?d.expenses:[];

const salesTotalLocal=w=>
DAYS.reduce((sum,day)=>sum+n(w.days?.[day])*n(w.price),0)+
sales.filter(x=>weekForDate(x.date)===w.start).reduce((sum,x)=>sum+n(x.qty)*n(x.price),0);

const totalSales=weeks.reduce((sum,w)=>sum+salesTotalLocal(w),0);
const totalIncome=income.reduce((sum,x)=>sum+n(x.amount),0);
const businessExpenses=expenses.filter(x=>x.type==='business').reduce((sum,x)=>sum+n(x.amount),0);
const personalExpenses=expenses.filter(x=>x.type==='personal').reduce((sum,x)=>sum+n(x.amount),0);
const totalExpenses=expenses.reduce((sum,x)=>sum+n(x.amount),0);
const cash=n(d.settings?.cash)+totalIncome-totalExpenses;

const name=d.settings?.name||c?.name||'Empresa';

const weekly={};
for(const w of weeks){
const start=w.start;
const weekSales=salesTotalLocal(w);
const weekIncome=income.filter(x=>weekForDate(x.date)===start).reduce((s,x)=>s+n(x.amount),0);
const weekExpenses=expenses.filter(x=>x.type==='business'&&weekForDate(x.date)===start).reduce((s,x)=>s+n(x.amount),0);
weekly[start]={sales:weekSales,income:weekIncome,expenses:weekExpenses};
}
const expenseCategories={};
for(const x of expenses.filter(x=>x.type==='business')){
const cat=x.category||'Otros';
expenseCategories[cat]=(expenseCategories[cat]||0)+n(x.amount);
}

globalMetrics.push({
id,name,
sales:totalSales,
income:totalIncome,
expenses:businessExpenses,
personal:personalExpenses,
profit:totalSales-businessExpenses,
cash,
weekly,
expenseCategories
});

}

setStatus('Sincronizado');

}catch(e){

console.error('Error actualizando General:',e);
setStatus('General pendiente de sincronizar',false);
/* Un fallo de lectura de General nunca cambia la empresa ni la vista. */

}finally{

globalLoading=false;

if(state.view==='global')
render();

}

}

function drawGlobalCharts(selectedId='all'){
if(typeof Chart==='undefined')return;

if(charts.globalGrowth){try{charts.globalGrowth.destroy();}catch(e){}}
if(charts.globalExpense){try{charts.globalExpense.destroy();}catch(e){}}

const growth=document.getElementById('globalGrowthChart');
const expense=document.getElementById('globalExpenseChart');
if(!growth||!expense)return;

let selected=globalMetrics;
if(selectedId&&selectedId!=='all'){
selected=globalMetrics.filter(x=>String(x.id)===String(selectedId));
}

const weekly={};
const cats={};

for(const m of selected){
for(const [start,v] of Object.entries(m.weekly||{})){
if(!weekly[start])weekly[start]={sales:0,income:0,expenses:0};
weekly[start].sales+=n(v.sales);
weekly[start].income+=n(v.income);
weekly[start].expenses+=n(v.expenses);
}
for(const [cat,val] of Object.entries(m.expenseCategories||{})){
cats[cat]=(cats[cat]||0)+n(val);
}
}

const starts=Object.keys(weekly).sort();
const labels=starts.map(start=>{
const d=parseDateSafe(start);
return d?d.toLocaleDateString('es-PE',{day:'2-digit',month:'short'}):start;
});

const muted=getComputedStyle(document.body).getPropertyValue('--muted').trim()||'#91a4ba';
const line=getComputedStyle(document.body).getPropertyValue('--line').trim()||'#263c58';
const accent=getComputedStyle(document.body).getPropertyValue('--accent').trim()||'#39d98a';
const accent2=getComputedStyle(document.body).getPropertyValue('--accent2').trim()||'#6d8cff';
const red=getComputedStyle(document.body).getPropertyValue('--red').trim()||'#ff6b7a';
const blue='#4f8cff';

Chart.defaults.color=muted;
Chart.defaults.font.family='-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif';
Chart.defaults.font.size=12;

const tick=v=>{
v=n(v);
if(Math.abs(v)>=1000000)return 'S/ '+(v/1000000).toFixed(1)+' M';
if(Math.abs(v)>=1000)return 'S/ '+(v/1000).toFixed(0)+' mil';
return 'S/ '+v.toFixed(0);
};

if(!starts.length){
const ctx=growth.getContext('2d');
ctx.clearRect(0,0,growth.width,growth.height);
const ec=expense.getContext('2d');
ec.clearRect(0,0,expense.width,expense.height);
const parent=growth.parentElement;
if(parent)parent.classList.add('chart-empty');
growth.insertAdjacentHTML('afterend','<div class="empty chart-empty-message">📊 Aún no hay semanas con datos suficientes para mostrar crecimiento.</div>');
expense.insertAdjacentHTML('afterend','<div class="empty chart-empty-message">💸 Aún no hay gastos de negocio registrados.</div>');
return;
}

const growthMsg=growth.parentElement?.querySelector('.chart-empty-message');
if(growthMsg)growthMsg.remove();
const expenseMsg=expense.parentElement?.querySelector('.chart-empty-message');
if(expenseMsg)expenseMsg.remove();

charts.globalGrowth=new Chart(growth,{
type:'line',
data:{
labels,
datasets:[
{label:'Ventas',data:starts.map(x=>weekly[x].sales),borderColor:accent,backgroundColor:accent+'22',fill:true,tension:.38,borderWidth:3,pointRadius:3,pointHoverRadius:6},
{label:'Ingresos',data:starts.map(x=>weekly[x].income),borderColor:blue,tension:.38,borderWidth:2.5,pointRadius:2.5,pointHoverRadius:5},
{label:'Gastos',data:starts.map(x=>weekly[x].expenses),borderColor:red,tension:.38,borderWidth:2.5,pointRadius:2.5,pointHoverRadius:5},
{label:'Utilidad',data:starts.map(x=>weekly[x].sales-weekly[x].expenses),borderColor:accent2,tension:.38,borderWidth:2.5,pointRadius:2.5,pointHoverRadius:5}
]
},
options:{
responsive:true,maintainAspectRatio:false,
interaction:{mode:'index',intersect:false},
animation:{duration:650,easing:'easeOutQuart'},
plugins:{
legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:16,boxWidth:8}},
tooltip:{backgroundColor:'rgba(20,25,35,.94)',titleColor:'#fff',bodyColor:'#fff',cornerRadius:12,padding:12,callbacks:{label:c=>' '+c.dataset.label+': '+money(c.parsed.y)}}
},
scales:{
x:{grid:{display:false},border:{display:false},ticks:{maxRotation:0}},
y:{beginAtZero:true,border:{display:false},grid:{color:line+'55',drawTicks:false},ticks:{callback:tick,padding:8}}
}
}
});

const catEntries=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
charts.globalExpense=new Chart(expense,{
type:'doughnut',
data:{
labels:catEntries.length?catEntries.map(x=>x[0]):['Sin gastos registrados'],
datasets:[{
data:catEntries.length?catEntries.map(x=>x[1]):[1],
backgroundColor:catEntries.length?[accent,blue,red,accent2,'#f7ba55','#8bd3dd','#c084fc','#fb7185','#94a3b8','#34d399'].slice(0,catEntries.length):['#94a3b8'],
borderWidth:3,
borderColor:getComputedStyle(document.body).getPropertyValue('--card').trim()||'#fff',
hoverOffset:7
}]
},
options:{
responsive:true,maintainAspectRatio:false,cutout:'68%',
animation:{duration:700,easing:'easeOutQuart'},
plugins:{
legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:16,boxWidth:8}},
tooltip:{backgroundColor:'rgba(20,25,35,.94)',titleColor:'#fff',bodyColor:'#fff',cornerRadius:12,padding:12,callbacks:{label:c=>' '+c.label+': '+money(c.parsed)}}
}
}
});

const badge=document.getElementById('globalExpenseBadge');
if(badge)badge.textContent=selectedId==='all'?'Consolidado':(selected[0]?.name||'Empresa');
}

function remove(kind,id,label){

const arr=state[kind];

const i=
arr.findIndex(
x=>String(x.id)===String(id)
);

const x=arr[i];

arr.splice(i,1);

queueSync();

undo(
label,
()=>{
if(
!arr.some(
y=>String(y.id)===String(x.id)
)
){
arr.splice(
Math.min(i,arr.length),
0,
x
);
}
queueSync();
render();
}
);

render();

}

function snapshotForMerge(x){
return x?structuredClone(x):structuredClone(DEFAULT);
}

function sameJson(a,b){
try{return JSON.stringify(a)===JSON.stringify(b);}catch(e){return false;}
}

function mergeArrayById(base,local,remote){
const B=new Map((Array.isArray(base)?base:[]).map(x=>[String(x.id),x]));
const L=new Map((Array.isArray(local)?local:[]).map(x=>[String(x.id),x]));
const R=new Map((Array.isArray(remote)?remote:[]).map(x=>[String(x.id),x]));
const ids=new Set([...B.keys(),...L.keys(),...R.keys()]);
const out=[];
for(const id of ids){
const b=B.get(id), l=L.get(id), r=R.get(id);
const lc=!sameJson(l,b);
const rc=!sameJson(r,b);
if(lc&&rc){
if(sameJson(l,r)){out.push(l);}
else if(l===undefined){ /* local deleted; keep local deletion */ }
else if(r===undefined){ out.push(l); }
else { out.push(l); }
}else if(lc){
if(l!==undefined)out.push(l);
}else if(rc){
if(r!==undefined)out.push(r);
}else if(l!==undefined){
out.push(l);
}else if(r!==undefined){
out.push(r);
}
}
return out;
}

function mergeServerState(base,local,remote){
const merged={...structuredClone(remote),...structuredClone(local)};
for(const k of ['weeks','sales','expenses','income','notes']){
merged[k]=mergeArrayById(base?.[k],local?.[k],remote?.[k]);
}
const scalar=['period','currentWeek'];
for(const k of scalar){
const lc=!sameJson(local?.[k],base?.[k]);
if(lc)merged[k]=local[k];
}
merged.settings={...structuredClone(remote?.settings||{}),...structuredClone(local?.settings||{})};
for(const k of ['name','cash','theme','font','logo']){
const lc=!sameJson(local?.settings?.[k],base?.settings?.[k]);
const rc=!sameJson(remote?.settings?.[k],base?.settings?.[k]);
if(lc)merged.settings[k]=local?.settings?.[k];
else if(rc)merged.settings[k]=remote?.settings?.[k];
}
return merged;
}

async function fetchServerCompanyData(companyId){
const {data,error}=await sb.from('company_app_data').select('company_id,data,updated_at').eq('company_id',companyId).maybeSingle();
if(error)throw error;
return data;
}

async function persist(){
if(!currentCompanyId||loading)return false;
const companyId=currentCompanyId;
const revision=localRevision;
const localSnapshot=snapshotForMerge(state);
const expectedBase=snapshotForMerge(baseServerState||state);

if(!localDirty&&!remotePendingSnapshot){
setStatus('Sincronizado');
return true;
}

persistChain=persistChain.catch(()=>false).then(async()=>{
if(companyId!==currentCompanyId)return false;
setStatus('Guardando…');

for(let attempt=1;attempt<=2;attempt++){
try{
let serverRow=await fetchServerCompanyData(companyId);
let snapshot=localSnapshot;

if(serverRow?.data&&!sameJson(serverRow.data,expectedBase)){
if(!localDirty){
snapshot=structuredClone(serverRow.data);
}else{
snapshot=mergeServerState(expectedBase,localSnapshot,serverRow.data);
}
}

snapshot.updatedAt=new Date().toISOString();

const payload={company_id:companyId,data:snapshot};
const {error}=await sb.from('company_app_data').upsert(
payload,
{onConflict:'company_id'}
);

if(error)throw error;

state={
...structuredClone(DEFAULT),
...snapshot,
settings:{...DEFAULT.settings,...(snapshot.settings||{})}
};

baseServerState=structuredClone(snapshot);
remotePendingSnapshot=null;
await writeIndexedCache(companyId,state);
try{localStorage.removeItem('gemelitas_cache_'+companyId);}catch(e){}
setStatus('Sincronizado');
if(localRevision===revision)localDirty=false;
return true;

}catch(error){
console.error('Error de guardado:',error);

if(attempt===1&&/jwt|token|session|auth/i.test(String(error?.message||''))){
try{await sb.auth.refreshSession();continue;}catch(e){console.warn('No se pudo renovar la sesión:',e);}
}
if(attempt===1&&navigator.onLine!==false){
await new Promise(r=>setTimeout(r,450));
continue;
}
setStatus('Pendiente de sincronizar · datos protegidos localmente',false);
return false;
}
}
return false;
});
return persistChain;
}

function authErrorText(error){
const msg=String(error?.message||error||'Error desconocido.');
if(/invalid login credentials/i.test(msg))return 'Correo o contraseña incorrectos.';
if(/email not confirmed/i.test(msg))return 'Este correo todavía no está confirmado en Supabase.';
if(/rate limit|too many requests/i.test(msg))return 'Demasiados intentos. Espera unos minutos y vuelve a intentarlo.';
if(/network|fetch|failed to fetch|timeout|offline/i.test(msg))return 'No hay conexión estable con Supabase. Revisa internet e inténtalo nuevamente.';
return msg;
}

async function bootAuthenticatedSession(session,source='session'){
if(!session?.user)return false;
if(bootInProgress&&bootPromise)return bootPromise;
bootInProgress=true;
currentUser=session.user;
bootPromise=(async()=>{
try{
try{await registerCurrentSession(session);}catch(e){console.warn('Registro de dispositivo omitido:',e);}
try{
await initCompanies();
}catch(e){
console.error('No se pudo preparar completamente la aplicación:',e);
try{
const ids=await getMemberships();
if(!ids.length)throw new Error('No hay empresas asignadas a este usuario.');
companies=ids.map(id=>({id,name:null}));
currentCompanyId=ids[0];
state=structuredClone(DEFAULT);
state.view='global';
loading=false;
}catch(recoveryError){
console.error('Recuperación de empresas fallida:',recoveryError);
showAppScreen();
const main=document.getElementById('main');
if(main){main.innerHTML=`<div class="card hero">
<div class="pill">CUENTA CONECTADA</div>
<h2 style="margin-top:10px">Tu sesión está activa.</h2>
<p class="sub">No se pudieron cargar las empresas en este momento. La sesión no se cerró. Puedes reintentar sin volver a iniciar sesión.</p>
<div class="row" style="margin-top:12px">
<button class="btn secondary" onclick="location.reload()">↻ Reintentar</button>
<button class="btn red" onclick="logout()">🚪 Cerrar sesión</button>
</div></div>`;}
return false;
}
}
state.view='global';
showAppScreen();
render();
setStatus('Sincronizado');
refreshGlobalMetrics().catch(e=>console.warn('General no pudo actualizarse:',e));
return true;
}catch(e){
console.error('Error inesperado después de autenticar:',e);
try{
if(!state)state=structuredClone(DEFAULT);
if(!currentCompanyId&&companies?.length)currentCompanyId=companies[0].id;
state.view='global';
loading=false;
showAppScreen();
render();
setStatus('Conectado · pendiente de actualizar',false);
refreshGlobalMetrics().catch(err=>console.warn('Actualización general pendiente:',err));
return true;
}catch(uiError){
console.error('No se pudo recuperar la interfaz:',uiError);
showLoginScreen('La sesión sigue activa, pero la interfaz necesita recargarse. Pulsa Reintentar.',true);
return false;
}
}finally{bootInProgress=false;}
})();
return bootPromise;
}

async function loginUser(){
if(loginBusy)return;
if(startupPromise){try{await startupPromise;}catch(e){console.warn(e);}}

const email=document.getElementById('loginEmail').value.trim();
const password=document.getElementById('loginPassword').value;
const message=document.getElementById('loginMessage');
const button=document.querySelector('#loginScreen .loginForm button');

if(!email||!password){
message.textContent='Completa tu correo electrónico y contraseña.';
message.className='loginMessage error';
return;
}

loginBusy=true;
if(button){button.disabled=true;button.classList.add('loginBusy');}
message.textContent='Verificando acceso…';
message.className='loginMessage';

try{
const {data,error}=await sb.auth.signInWithPassword({email,password});

if(error){
message.textContent=authErrorText(error);
message.className='loginMessage error';
return;
}

const ok=await bootAuthenticatedSession(data.session,'login');

if(!ok){
/* La sesión queda disponible para poder reintentar sin crear una sesión
   adicional. Si el problema fue una lectura temporal, el siguiente intento
   volverá a cargar la información. */
return;
}

message.textContent='';
document.getElementById('loginPassword').value='';

}catch(e){
console.error(e);
message.textContent='No se pudo completar el inicio de sesión. '+authErrorText(e);
message.className='loginMessage error';
showLoginScreen(message.textContent,true);
}finally{
loginBusy=false;
if(button){button.disabled=false;button.classList.remove('loginBusy');}
}
}

document.getElementById('app').style.display='none';
document.getElementById('loginScreen').style.display='flex';
}
});


document.addEventListener('click',e=>{
const b=e.target.closest('button,.btn');
if(!b||b.disabled)return;
b.classList.remove('ripple-go');void b.offsetWidth;b.classList.add('ripple-go');
playClickSound();
});

document.addEventListener('visibilitychange',()=>{
if(document.visibilityState==='visible'&&currentUser){
syncNow();
checkCurrentSessionHealth();
}
});

window.addEventListener('online',()=>{
if(currentUser){
setStatus('Conexión recuperada');
syncNow();
loadDeviceSessions(false);
}
});

document.getElementById('loginEmail')?.addEventListener('keydown',e=>{
if(e.key==='Enter'){e.preventDefault();loginUser();}
});
document.getElementById('loginPassword')?.addEventListener('keydown',e=>{
if(e.key==='Enter'){e.preventDefault();loginUser();}
});

startupPromise=(async()=>{
await migrateLegacyCaches();
await checkSession();
})();

</script>

<script>

if(
'serviceWorker' in navigator
){

window.addEventListener(
'load',
()=>
navigator.serviceWorker.register(
'./sw.js'
)
);

}

</script>
