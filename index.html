<style>
:root{--bg:#07111f;--bg2:#0b1627;--card:#101d30;--card2:#15243a;--line:#263c58;--text:#f4f7fb;--muted:#91a4ba;--accent:#39d98a;--accent2:#6d8cff;--red:#ff6b7a;--gold:#f7ba55;--shadow:0 18px 45px rgba(0,0,0,.28);--radius:22px;--fs:16px}
body[data-theme="light"]{--bg:#edf3f9;--bg2:#e6edf6;--card:#fff;--card2:#f4f7fb;--line:#d9e2ee;--text:#172033;--muted:#6d7a8c;--shadow:0 15px 35px rgba(32,50,75,.10)}
body[data-theme="violet"]{--bg:#100d1f;--bg2:#19132d;--card:#201a35;--card2:#292143;--line:#403661;--accent:#b596ff;--accent2:#6fe6ff}
*{box-sizing:border-box}html{font-size:var(--fs)}body{margin:0;background:radial-gradient(circle at 10% 0,var(--bg2),var(--bg) 52%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{max-width:1320px;margin:auto;padding:18px 18px 95px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:13px}.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:25px;box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 30%,transparent)}h1{margin:0;font-size:1.32rem}.sub{color:var(--muted);font-size:.78rem;margin-top:3px}.nav{display:flex;gap:7px;overflow:auto;padding:18px 0 10px}.nav button,.btn{border:0;border-radius:13px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer;transition:.2s}.nav button{background:var(--card);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}.nav button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#07111f;border-color:transparent}.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06111e}.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.red{background:var(--red);color:#fff}.btn.small{padding:7px 10px;font-size:.78rem}.btn:hover{transform:translateY(-1px)}.grid{display:grid;gap:13px}.kpis{grid-template-columns:repeat(6,1fr)}.card{background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--card) 86%,var(--bg)));border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.kpi{position:relative;overflow:hidden;min-height:118px}.kpi:before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-35px;top:-35px;background:color-mix(in srgb,var(--accent) 14%,transparent)}.kpi label{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;font-weight:900;letter-spacing:.06em}.kpi strong{display:block;font-size:1.32rem;margin-top:14px;letter-spacing:-.03em}.kpi small{color:var(--muted);display:block;margin-top:6px}.green{color:var(--accent)}.redtxt{color:var(--red)}.goldtxt{color:var(--gold)}.blue{color:var(--accent2)}.hero{background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 20%,var(--card)),var(--card) 48%,color-mix(in srgb,var(--accent2) 18%,var(--card)));position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-120px;bottom:-170px;background:color-mix(in srgb,var(--accent2) 18%,transparent);filter:blur(15px)}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px}.section h2{font-size:1.08rem;margin:0}.two{grid-template-columns:1.2fr .8fr}.chart{height:285px}.form{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.field label{display:block;font-size:.68rem;color:var(--muted);font-weight:900;text-transform:uppercase;margin-bottom:5px}input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;font:inherit}textarea{min-height:72px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:.68rem;text-transform:uppercase;color:var(--muted)}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:14px;margin-bottom:8px}.item small{display:block;color:var(--muted);margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:32px}.pill{padding:4px 9px;border-radius:99px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-size:.72rem;font-weight:900}.notice{padding:11px;border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 8%,transparent);border-radius:9px;color:var(--muted)}.settings-grid{grid-template-columns:repeat(3,1fr)}.theme-dot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:inline-block}.undo{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:11px 14px;border-radius:14px;box-shadow:var(--shadow);display:none;z-index:10}.undo.show{display:flex;gap:12px;align-items:center}.period button{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:7px 10px;border-radius:9px;cursor:pointer}.period button.active{border-color:var(--accent);color:var(--accent)}@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.form{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.app{padding:12px 10px 90px}.top{align-items:flex-start}.brand h1{font-size:1.08rem}.kpis{grid-template-columns:1fr 1fr}.form,.settings-grid{grid-template-columns:1fr}.chart{height:235px}.kpi strong{font-size:1.05rem}.item{align-items:flex-start;flex-direction:column}.actions{width:100%}}
</style>

<div class="app"><div class="top"><div class="brand"><div class="logo">🍽️</div><div><h1 id="brandName">GEMELITAS A&A S.A.C.</h1><div class="sub">Sistema inteligente de gestión financiera</div></div></div><div class="row"><button class="btn secondary small" onclick="backup()">💾 Respaldo</button><button class="btn secondary small" onclick="restoreFile()">📥 Restaurar</button></div></div><div class="nav" id="nav"></div><main id="main"></main></div><div class="undo" id="undo"></div>
<script>
const SUPABASE_URL = 'https://wkcichivvfptfcprpgzs.supabase.co'
const SUPABASE_KEY = 'sb_publishable_H2NBtIqEjs3jwuF6Pdi0dQ_x49-9Ucp'
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const CATS=['Insumos','Carnes','Transporte','Combustible','Descartables','Personal','Gas','Agua','Luz','Internet','Tienda','Otros'];
let state=JSON.parse(localStorage.getItem('gemelitas_pro_v1')||'null')||{view:'dashboard',period:'semana',settings:{name:'GEMELITAS A&A S.A.C.',cash:0,theme:'dark',font:16},weeks:[],sales:[],expenses:[],income:[],notes:[],history:[]};let charts={};let undoData=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const n=x=>Number(x)||0;const money=x=>'S/ '+n(x).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem('gemelitas_pro_v1',JSON.stringify(state));document.body.dataset.theme=state.settings.theme;document.documentElement.style.setProperty('--fs',state.settings.font+'px');document.getElementById('brandName').textContent=state.settings.name}
function weekForDate(d){const x=new Date(d+'T12:00:00'),day=x.getDay(),diff=day===0?-6:1-day;x.setDate(x.getDate()+diff);return x.toISOString().slice(0,10)}
function ensureWeek(start=weekForDate(today())){let w=state.weeks.find(x=>x.start===start);if(!w){w={id:uid(),label:'Semana '+(state.weeks.length+1),start,price:7,days:Object.fromEntries(DAYS.map(d=>[d,0]))};state.weeks.push(w);save()}return w}
function selectedWeek(){return ensureWeek(state.currentWeek||weekForDate(today()))}
function weekTotal(w){return DAYS.reduce((s,d)=>s+n(w.days[d])*n(w.price),0)}
function extrasForWeek(w){return state.sales.filter(x=>weekForDate(x.date)===w.start).reduce((s,x)=>s+n(x.qty)*n(x.price),0)}
function expensesForWeek(w,type='business'){return state.expenses.filter(x=>weekForDate(x.date)===w.start&&x.type===type).reduce((s,x)=>s+n(x.amount),0)}
function incomeForWeek(w){return state.income.filter(x=>x.weekId===w.id).reduce((s,x)=>s+n(x.amount),0)}
function salesTotal(w){return weekTotal(w)+extrasForWeek(w)}
function pendingWeek(w){return Math.max(0,salesTotal(w)-incomeForWeek(w))}
function undo(label,fn){undoData=fn;const el=document.getElementById('undo');el.innerHTML=`${label}<button class="btn small" onclick="doUndo()">Deshacer</button>`;el.classList.add('show');setTimeout(()=>{if(el.classList.contains('show'))el.classList.remove('show')},7000)}function doUndo(){if(undoData){undoData();save();render()}document.getElementById('undo').classList.remove('show')}
function nav(){const items=[['dashboard','🏠 Inicio'],['week','📅 Semana'],['income','💵 Ingresos'],['expenses','💸 Gastos'],['notes','📝 Notas'],['reports','📊 Reportes'],['settings','⚙️ Ajustes']];return items.map(([k,l])=>`<button class="${state.view===k?'active':''}" onclick="state.view='${k}';render()">${l}</button>`).join('')}
function rangeWeeks(){let a=[...state.weeks].sort((a,b)=>a.start.localeCompare(b.start));if(state.period==='semana')return a.slice(-1);if(state.period==='mes'){const m=today().slice(0,7);return a.filter(w=>w.start.slice(0,7)===m)}if(state.period==='anio'){const y=today().slice(0,4);return a.filter(w=>w.start.slice(0,4)===y)}return a}
function dashboard(){const ws=rangeWeeks();const sold=ws.reduce((s,w)=>s+salesTotal(w),0),inc=ws.reduce((s,w)=>s+incomeForWeek(w),0),bus=ws.reduce((s,w)=>s+expensesForWeek(w),0),per=ws.reduce((s,w)=>s+expensesForWeek(w,'personal'),0),pend=ws.reduce((s,w)=>s+pendingWeek(w),0),profit=sold-bus,cash=n(state.settings.cash)+state.income.reduce((s,x)=>s+n(x.amount),0)-state.expenses.reduce((s,x)=>s+n(x.amount),0);
return `<div class="card hero"><div class="section" style="margin:0"><div><div class="pill">CONTROL EN TIEMPO REAL</div><h2 style="font-size:1.5rem;margin-top:10px">Tu negocio, con visión de crecimiento 🚀</h2><p class="sub">Ventas, rentabilidad, caja y tendencias en un solo lugar.</p></div><div class="period">${['semana','mes','anio','todo'].map(p=>`<button class="${state.period===p?'active':''}" onclick="state.period='${p}';render()">${p==='anio'?'Año':p[0].toUpperCase()+p.slice(1)}</button>`).join('')}</div></div></div><div class="grid kpis" style="margin-top:13px"><div class="card kpi"><label>Ventas</label><strong class="green">${money(sold)}</strong><small>Lo generado por menús y extras</small></div><div class="card kpi"><label>Ingresos recibidos</label><strong class="blue">${money(inc)}</strong><small>Dinero realmente registrado</small></div><div class="card kpi"><label>Por cobrar</label><strong class="goldtxt">${money(pend)}</strong><small>Referencia automática por ventas</small></div><div class="card kpi"><label>Gastos negocio</label><strong class="redtxt">${money(bus)}</strong><small>Operación real</small></div><div class="card kpi"><label>Utilidad estimada</label><strong class="green">${money(profit)}</strong><small>Ventas − gastos del negocio</small></div><div class="card kpi"><label>Caja disponible</label><strong>${money(cash)}</strong><small>Incluye retiros personales</small></div></div><div class="grid two" style="margin-top:13px"><div class="card"><div class="section"><h2>📈 Crecimiento del negocio</h2><span class="pill">Visión ejecutiva</span></div><div class="chart"><canvas id="salesChart"></canvas></div></div><div class="card"><div class="section"><h2>💸 ¿En qué se está gastando?</h2></div><div class="chart"><canvas id="expenseChart"></canvas></div></div></div><div class="card" style="margin-top:13px"><div class="notice">👨‍👩‍👧 Gastos personales registrados: <b>${money(per)}</b>. Se muestran por separado para no alterar la rentabilidad real del negocio.</div></div>`}
function weekView(){const w=selectedWeek();return `<div class="section"><h2>📅 Control de ${w.label}</h2><div class="row"><input style="width:160px" type="date" value="${w.start}" onchange="state.currentWeek=weekForDate(this.value);render()"><button class="btn secondary small" onclick="newWeek()">+ Nueva semana</button></div></div><div class="card"><div class="form"><div class="field"><label>Nombre semana</label><input value="${w.label}" onchange="wedit('label',this.value)"></div><div class="field"><label>Precio menú empresa</label><input type="number" step=".01" value="${w.price}" onchange="wedit('price',this.value)"></div></div><div class="tablewrap"><table><thead><tr><th>Día</th><th>Menús empresa</th><th>Total para cobrar</th></tr></thead><tbody>${DAYS.map(d=>`<tr><td>${d}</td><td><input type="number" min="0" value="${w.days[d]}" onchange="dayedit('${d}',this.value)"></td><td>${money(n(w.days[d])*n(w.price))}</td></tr>`).join('')}</tbody></table></div><div class="section"><h2>Total empresa: <span class="green">${money(weekTotal(w))}</span></h2><span class="pill">${DAYS.reduce((s,d)=>s+n(w.days[d]),0)} menús</span></div><div class="notice">Este total sirve como referencia para revisar cuánto corresponde cobrar a la empresa. El dinero recibido se registra aparte en <b>Ingresos</b>.</div></div><div class="card"><div class="section"><h2>➕ Ventas adicionales</h2><span>Total: <b>${money(extrasForWeek(w))}</b></span></div><div class="form"><div class="field"><label>Fecha</label><input type="date" id="sdate" value="${today()}"></div><div class="field"><label>Producto</label><input id="sprod" placeholder="Menú, gaseosa..."></div><div class="field"><label>Cantidad</label><input id="sqty" type="number" value="1"></div><div class="field"><label>Precio</label><input id="sprice" type="number" step=".01" placeholder="0.00"></div><button class="btn" onclick="addSale()">Agregar</button></div>${listSales(w)}</div>`}
function incomeView(){const w=selectedWeek();const list=state.income.filter(x=>x.weekId===w.id);return `<div class="section"><h2>💵 Ingresos de ${w.label}</h2><span class="pill">Total ${money(incomeForWeek(w))}</span></div><div class="card"><div class="notice">Registra aquí únicamente el dinero que realmente ingresó. Ejemplo: <b>Empresa pagó S/3,000</b>. Puedes registrar impuestos, descuentos u otros conceptos como ingresos separados si corresponde.</div><div class="form" style="margin-top:12px"><div class="field"><label>Fecha</label><input type="date" id="idate" value="${today()}"></div><div class="field"><label>Concepto</label><input id="idesc" placeholder="Empresa - pago semana"></div><div class="field"><label>Monto recibido</label><input id="iamt" type="number" step=".01"></div><div class="field"><label>Semana a la que corresponde</label><select id="iweek">${state.weeks.map(x=>`<option value="${x.id}" ${x.id===w.id?'selected':''}>${x.label} (${x.start})</option>`).join('')}</select></div><button class="btn" onclick="addIncome()">Registrar ingreso</button></div></div><div class="card">${list.length?list.map(x=>itemIncome(x)).join(''):'<div class="empty">Aún no hay ingresos registrados para esta semana.</div>'}</div>`}
function expensesView(){const list=[...state.expenses].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="section"><h2>💸 Gastos y retiros</h2></div><div class="card"><div class="form"><div class="field"><label>Fecha</label><input id="edate" type="date" value="${today()}"></div><div class="field"><label>Tipo</label><select id="etype"><option value="business">Negocio</option><option value="personal">Personal / Familiar</option></select></div><div class="field"><label>Categoría</label><select id="ecat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Monto</label><input id="eamt" type="number" step=".01"></div><div class="field"><label>Descripción</label><input id="edesc" placeholder="Detalle opcional"></div><button class="btn red" onclick="addExpense()">Registrar gasto</button></div></div><div class="card">${list.length?list.map(x=>itemExpense(x)).join(''):'<div class="empty">Sin gastos registrados.</div>'}</div>`}
function notesView(){return `<div class="section"><h2>📝 Notas rápidas</h2></div><div class="card"><div class="form"><div class="field" style="grid-column:span 3"><label>Nota</label><input id="noteText" placeholder="Ej: Empresa aún debe confirmar el pago..."></div><button class="btn" onclick="addNote()">Guardar nota</button></div></div><div class="card">${state.notes.length?state.notes.map(x=>`<div class="item"><div>📝 ${esc(x.text)}<small>${x.date}</small></div><div class="actions"><button class="btn secondary small" onclick="deleteNote('${x.id}')">🗑 Borrar</button></div></div>`).join(''):'<div class="empty">No hay notas pendientes.</div>'}</div>`}
function reports(){const ws=[...state.weeks].sort((a,b)=>b.start.localeCompare(a.start));return `<div class="section"><h2>📊 Reportes por semana</h2></div><div class="card tablewrap"><table><thead><tr><th>Semana</th><th>Ventas</th><th>Ingresos</th><th>Gastos negocio</th><th>Utilidad</th><th>Referencia por cobrar</th></tr></thead><tbody>${ws.map(w=>`<tr><td>${w.label}<small>${w.start}</small></td><td>${money(salesTotal(w))}</td><td>${money(incomeForWeek(w))}</td><td>${money(expensesForWeek(w))}</td><td class="green">${money(salesTotal(w)-expensesForWeek(w))}</td><td class="goldtxt">${money(pendingWeek(w))}</td></tr>`).join('')}</tbody></table></div>`}
function settingsView(){return `<div class="section"><h2>⚙️ Ajustes</h2></div><div class="grid settings-grid"><div class="card"><h3>🎨 Apariencia</h3><div class="field"><label>Modo y color</label><select onchange="state.settings.theme=this.value;save();render()"><option value="dark" ${state.settings.theme==='dark'?'selected':''}>🌙 Noche premium</option><option value="light" ${state.settings.theme==='light'?'selected':''}>☀️ Día claro</option><option value="violet" ${state.settings.theme==='violet'?'selected':''}>🟣 Violeta ejecutivo</option></select></div></div><div class="card"><h3>🔤 Tamaño de letras</h3><div class="field"><label>Escala</label><select onchange="state.settings.font=n(this.value);save();render()">${[14,15,16,17,18,20].map(x=>`<option ${state.settings.font===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="card"><h3>🏢 Negocio</h3><div class="field"><label>Nombre</label><input value="${esc(state.settings.name)}" onchange="state.settings.name=this.value||'GEMELITAS A&A S.A.C.';save();render()"></div><div class="field"><label>Caja inicial</label><input type="number" step=".01" value="${state.settings.cash}" onchange="state.settings.cash=n(this.value);save();render()"></div></div></div><div class="card"><h3>🛡️ Seguridad de datos</h3><p class="sub">Los datos se guardan automáticamente en este navegador. Usa Respaldo periódicamente para conservar una copia.</p><div class="row"><button class="btn secondary" onclick="backup()">💾 Descargar respaldo</button><button class="btn secondary" onclick="restoreFile()">📥 Restaurar respaldo</button></div></div>`}
function render(){save();document.getElementById('nav').innerHTML=nav();let v=state.view;document.getElementById('main').innerHTML=v==='dashboard'?dashboard():v==='week'?weekView():v==='income'?incomeView():v==='expenses'?expensesView():v==='notes'?notesView():v==='reports'?reports():settingsView();if(v==='dashboard')setTimeout(drawCharts,30)}
function wedit(k,v){selectedWeek()[k]=k==='price'?n(v):v;save();render()}function dayedit(d,v){selectedWeek().days[d]=n(v);save();render()}function newWeek(){let d=new Date(selectedWeek().start+'T12:00:00');d.setDate(d.getDate()+7);state.currentWeek=weekForDate(d.toISOString().slice(0,10));ensureWeek(state.currentWeek);render()}
function addSale(){let x={id:uid(),date:document.getElementById('sdate').value,product:document.getElementById('sprod').value||'Venta adicional',qty:n(document.getElementById('sqty').value),price:n(document.getElementById('sprice').value)};if(x.qty<=0||x.price<=0)return alert('Ingresa cantidad y precio válidos.');state.sales.push(x);save();render()}function listSales(w){let a=state.sales.filter(x=>weekForDate(x.date)===w.start);return a.length?a.map(x=>`<div class="item"><div><b>${esc(x.product)}</b><small>${x.date} · ${x.qty} × ${money(x.price)}</small></div><div><b>${money(x.qty*x.price)}</b><div class="actions"><button class="btn secondary small" onclick="editSale('${x.id}')">✏️</button><button class="btn secondary small" onclick="deleteSale('${x.id}')">🗑</button></div></div></div>`).join(''):'<div class="empty">Sin ventas adicionales.</div>'}
function addIncome(){let x={id:uid(),date:document.getElementById('idate').value,description:document.getElementById('idesc').value||'Ingreso',amount:n(document.getElementById('iamt').value),weekId:document.getElementById('iweek').value};if(x.amount<=0)return alert('Ingresa un monto válido.');state.income.push(x);save();render()}function itemIncome(x){return `<div class="item"><div><b>${esc(x.description)}</b><small>${x.date}</small></div><div class="green"><b>${money(x.amount)}</b><div class="actions"><button class="btn secondary small" onclick="editIncome('${x.id}')">✏️</button><button class="btn secondary small" onclick="deleteIncome('${x.id}')">🗑</button></div></div></div>`}
function addExpense(){let x={id:uid(),date:document.getElementById('edate').value,type:document.getElementById('etype').value,category:document.getElementById('ecat').value,amount:n(document.getElementById('eamt').value),description:document.getElementById('edesc').value};if(x.amount<=0)return alert('Ingresa un monto válido.');state.expenses.push(x);save();render()}function itemExpense(x){return `<div class="item"><div><b>${x.type==='business'?'🔴 Negocio':'🟠 Personal'} · ${esc(x.category)}</b><small>${x.date}${x.description?' · '+esc(x.description):''}</small></div><div class="redtxt"><b>−${money(x.amount)}</b><div class="actions"><button class="btn secondary small" onclick="editExpense('${x.id}')">✏️</button><button class="btn secondary small" onclick="deleteExpense('${x.id}')">🗑</button></div></div></div>`}
function deleteSale(id){let i=state.sales.findIndex(x=>x.id===id),x=state.sales[i];state.sales.splice(i,1);save();undo('Venta eliminada',()=>state.sales.splice(i,0,x));render()}function deleteIncome(id){let i=state.income.findIndex(x=>x.id===id),x=state.income[i];state.income.splice(i,1);save();undo('Ingreso eliminado',()=>state.income.splice(i,0,x));render()}function deleteExpense(id){let i=state.expenses.findIndex(x=>x.id===id),x=state.expenses[i];state.expenses.splice(i,1);save();undo('Gasto eliminado',()=>state.expenses.splice(i,0,x));render()}function deleteNote(id){let i=state.notes.findIndex(x=>x.id===id),x=state.notes[i];state.notes.splice(i,1);save();undo('Nota eliminada',()=>state.notes.splice(i,0,x));render()}
function editSale(id){let x=state.sales.find(x=>x.id===id),q=prompt('Cantidad',x.qty),p=prompt('Precio',x.price),d=prompt('Producto',x.product);if(q!==null&&p!==null){x.qty=n(q);x.price=n(p);if(d!==null)x.product=d;save();render()}}function editIncome(id){let x=state.income.find(x=>x.id===id),a=prompt('Monto recibido',x.amount),d=prompt('Concepto',x.description);if(a!==null){x.amount=n(a);if(d!==null)x.description=d;save();render()}}function editExpense(id){let x=state.expenses.find(x=>x.id===id),a=prompt('Monto',x.amount),d=prompt('Descripción',x.description||'');if(a!==null){x.amount=n(a);if(d!==null)x.description=d;save();render()}}
function addNote(){let t=document.getElementById('noteText').value.trim();if(!t)return;state.notes.unshift({id:uid(),text:t,date:today()});save();render()}
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function drawCharts(){if(typeof Chart==='undefined')return;Object.values(charts).forEach(c=>c.destroy());let ws=[...state.weeks].sort((a,b)=>a.start.localeCompare(b.start)),labels=ws.map(w=>w.label),accent=getComputedStyle(document.body).getPropertyValue('--accent').trim(),accent2=getComputedStyle(document.body).getPropertyValue('--accent2').trim(),red=getComputedStyle(document.body).getPropertyValue('--red').trim(),muted=getComputedStyle(document.body).getPropertyValue('--muted').trim();Chart.defaults.color=muted;charts.sales=new Chart(document.getElementById('salesChart'),{type:'line',data:{labels,datasets:[{label:'Ventas',data:ws.map(salesTotal),borderColor:accent,backgroundColor:accent+'33',fill:true,tension:.42,pointRadius:4},{label:'Utilidad',data:ws.map(w=>salesTotal(w)-expensesForWeek(w)),borderColor:accent2,tension:.42,pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{grid:{display:false}},y:{grid:{color:'rgba(150,170,190,.12)'}}}}});let cats=CATS.map(c=>[c,state.expenses.filter(x=>x.type==='business'&&x.category===c).reduce((s,x)=>s+n(x.amount),0)]).filter(x=>x[1]>0);charts.exp=new Chart(document.getElementById('expenseChart'),{type:'doughnut',data:{labels:cats.map(x=>x[0]),datasets:[{data:cats.map(x=>x[1]),backgroundColor:[accent,accent2,'#f7ba55',red,'#ff9f43','#57d1c9','#c18cff']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}})}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Respaldo_GEMELITAS_AA_'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function restoreFile(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();alert('Respaldo restaurado correctamente.')}catch{alert('Archivo inválido.')}};r.readAsText(e.target.files[0])};i.click()}
ensureWeek();render();
async function loginUser(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const message = document.getElementById('loginMessage');

  message.textContent = 'Iniciando sesión...';

  const { data, error } = await sb.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = 'Error: ' + error.message;
    return;
  }

  document.getElementById('loginScreen').style.display = 'none';
  message.textContent = '';

  render();
}</script>
