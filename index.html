const DAYS=[

const DEFAULT={

const uid=()=>{
if(crypto.randomUUID)
return crypto.randomUUID();

return Date.now().toString(36)+
Math.random().toString(36).slice(2);
};

const n=x=>Number(x)||0;

const money=x=>
'S/ '+n(x).toLocaleString(
'es-PE',
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

const today=()=>
new Date().toISOString().slice(0,10);

const esc=s=>
String(s??'').replace(
/[&<>'"]/g,
c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
"'":'&#39;',
'"':'&quot;'
}[c])
);

function setStatus(text,good=true){

const e=document.getElementById('syncStatus');

if(!e)return;

e.className='sync '+(good?'ok':'bad');

e.innerHTML=
'<span class="statusdot"></span>'+
esc(text);

function saveLocal(){

localStorage.setItem(
'gemelitas_cache_'+
(currentCompanyId||'none'),
JSON.stringify(state)
);

document.body.dataset.theme=
state.settings.theme;

document.documentElement.style.setProperty(
'--fs',
state.settings.font+'px'
);

document.getElementById('brandName').textContent=
state.settings.name||'Empresa';

}

function weekForDate(d){

const x=new Date(d+'T12:00:00');

const day=x.getDay();

const diff=day===0?-6:1-day;

x.setDate(x.getDate()+diff);

return x.toISOString().slice(0,10);

}

function ensureWeek(
start=weekForDate(today())
){

let w=
state.weeks.find(
x=>x.start===start
);

if(!w){

w={
id:uid(),
label:'Semana '+(state.weeks.length+1),
start,
price:7,
days:Object.fromEntries(
DAYS.map(d=>[d,0])
)
};

state.weeks.push(w);

saveLocal();

}

return w;

}

function selectedWeek(){

return ensureWeek(
state.currentWeek||
weekForDate(today())
);

}

function weekTotal(w){

return DAYS.reduce(
(s,d)=>
s+
n(w.days?.[d])*
n(w.price),
0
);

}

function extrasForWeek(w){

return state.sales
.filter(
x=>weekForDate(x.date)===w.start
)
.reduce(
(s,x)=>
s+n(x.qty)*n(x.price),
0
);

}

function expensesForWeek(
w,
type='business'
){

return state.expenses
.filter(
x=>
weekForDate(x.date)===w.start &&
x.type===type
)
.reduce(
(s,x)=>s+n(x.amount),
0
);

}

function incomeForWeek(w){

return state.income
.filter(
x=>
x.weekId===w.id ||
weekForDate(x.date)===w.start
)
.reduce(
(s,x)=>s+n(x.amount),
0
);

}

function salesTotal(w){

return weekTotal(w)+
extrasForWeek(w);

}

function pendingWeek(w){

return Math.max(
0,
salesTotal(w)-
incomeForWeek(w)
);

}

function rangeWeeks(){

let a=
[...state.weeks]
.sort(
(a,b)=>
a.start.localeCompare(b.start)
);

if(state.period==='semana')
return a.slice(-1);

if(state.period==='mes'){

const m=today().slice(0,7);

return a.filter(
w=>w.start.slice(0,7)===m
);

}

if(state.period==='anio'){

const y=today().slice(0,4);

return a.filter(
w=>w.start.slice(0,4)===y
);

}

return a;

}

async function refreshGlobalMetrics(){

if(!currentUser)
return;

globalLoading=true;

globalMetrics=[];

try{

const ids=await getMemberships();

for(const id of ids){

const c=companies.find(x=>x.id===id);

const {data,error}=await sb
.from('company_app_data')
.select('data,updated_at')
.eq('company_id',id)
.maybeSingle();

if(error)
throw error;

const d=data?.data||null;

if(!d){

globalMetrics.push({
id,
name:c?.name||'Empresa',
sales:0,income:0,expenses:0,personal:0,profit:0,cash:0
});
continue;
}

const weeks=Array.isArray(d.weeks)?d.weeks:[];
const sales=Array.isArray(d.sales)?d.sales:[];
const income=Array.isArray(d.income)?d.income:[];
const expenses=Array.isArray(d.expenses)?d.expenses:[];

const salesTotalLocal=w=>
DAYS.reduce((sum,day)=>sum+n(w.days?.[day])*n(w.price),0)+
sales.filter(x=>weekForDate(x.date)===w.start).reduce((sum,x)=>sum+n(x.qty)*n(x.price),0);

const totalSales=weeks.reduce((sum,w)=>sum+salesTotalLocal(w),0);
const totalIncome=income.reduce((sum,x)=>sum+n(x.amount),0);
const businessExpenses=expenses.filter(x=>x.type==='business').reduce((sum,x)=>sum+n(x.amount),0);
const personalExpenses=expenses.filter(x=>x.type==='personal').reduce((sum,x)=>sum+n(x.amount),0);
const totalExpenses=expenses.reduce((sum,x)=>sum+n(x.amount),0);
const cash=n(d.settings?.cash)+totalIncome-totalExpenses;

const name=d.settings?.name||c?.name||'Empresa';

globalMetrics.push({
id,name,
sales:totalSales,
income:totalIncome,
expenses:businessExpenses,
personal:personalExpenses,
profit:totalSales-businessExpenses,
cash
});

}

setStatus('Sincronizado');

}catch(e){

console.error(e);
setStatus('No se pudo cargar el resumen general',false);

}finally{

globalLoading=false;

if(state.view==='global')
render();

}

}

v==='global'
?globalDashboard()

?dashboard()

:v==='income'

function remove(kind,id,label){

const arr=state[kind];

const i=
arr.findIndex(
x=>String(x.id)===String(id)
);

if(i<0)
return;

const x=arr[i];

arr.splice(i,1);

queueSync();

undo(
label,
()=>{
if(
!arr.some(
y=>String(y.id)===String(x.id)
)
){
arr.splice(
Math.min(i,arr.length),
0,
x
);
}
queueSync();
render();
}
);

render();

}

function queueSync(){

localRevision++;

localDirty=true;

saveLocal();

clearTimeout(saveTimer);

saveTimer=
setTimeout(
syncNow,
600
);

}

function localOldState(){

try{

return JSON.parse(
localStorage.getItem(
OLD_KEY
)||'null'
);

}catch{

return null;

}

}

function mergeLegacy(legacy){

if(!legacy)
return;

const keys=[
'weeks',
'sales',
'expenses',
'income',
'notes'
];

for(
const k of keys
){

if(
Array.isArray(legacy[k])&&
legacy[k].length&&
!state[k].length
){

state[k]=legacy[k];

}

}

if(legacy.settings){

state.settings={
...state.settings,
...legacy.settings
};

}

if(legacy.view)
state.view=legacy.view;

}

async function getMemberships(){

const {
data,
error
}=
await sb
.from('company_members')
.select('company_id')
.eq(
'user_id',
currentUser.id
);

if(error)
throw error;

return [
...new Set(
(data||[])
.map(
x=>x.company_id
)
.filter(Boolean)
)
];

}

async function loadCompany(id){

currentCompanyId=id;

loading=true;

setStatus(
'Cargando empresa…'
);

if(realtimeChannel){

try{
await sb.removeChannel(realtimeChannel);
}catch(e){
console.warn(e);
}

realtimeChannel=null;

}

const cached=
localStorage.getItem(
'gemelitas_cache_'+id
);

let localState=
structuredClone(DEFAULT);

try{

if(cached)
localState={
...structuredClone(DEFAULT),
...JSON.parse(cached)
};

}catch(e){

console.warn('Caché local inválida',e);

}

state=localState;

localRevision=0;

localDirty=false;

let serverData=null;

try{

const {
data,
error
}=
await sb
.from('company_app_data')
.select(
'company_id,data,updated_at'
)
.eq(
'company_id',
id
)
.maybeSingle();

if(error)
throw error;

serverData=data;

}catch(error){

console.error(error);

setStatus(
'Sin conexión · usando datos locales',
false
);

ensureWeek();

loading=false;

render();

updateCompanySelect();

return;

}

if(serverData?.data){

state={
...structuredClone(DEFAULT),
...serverData.data,
settings:{
...DEFAULT.settings,
...(serverData.data.settings||{})
}
};

}else{

/*
Si por alguna razón la empresa todavía no tiene
un registro central, recuperamos únicamente el
estado local antiguo como migración inicial.
Después de esto, company_app_data es la fuente
única de verdad.
*/

mergeLegacy(
localOldState()
);

}

ensureWeek();

saveLocal();

loading=false;

if(!serverData?.data){

await persist();

}else{

render();

setStatus(
'Sincronizado'
);

}

updateCompanySelect();

/*
Sincronización en tiempo real entre dispositivos.
Si otro teléfono, laptop o PC cambia la empresa,
el cambio se refleja sin volver a iniciar sesión.
*/

try{

realtimeChannel=
sb
.channel(
'company_app_data_'+id
)
.on(
'postgres_changes',
{
event:'*',
schema:'public',
table:'company_app_data',
filter:'company_id=eq.'+id
},
payload=>{

const incoming=
payload?.new?.data;

if(
!incoming||
payload?.new?.company_id!==currentCompanyId
)
return;

if(localDirty)
return;

const incomingTime=
Date.parse(
incoming.updatedAt||payload?.new?.updated_at||''
);

const localTime=
Date.parse(
state.updatedAt||''
);

if(
Number.isFinite(incomingTime)&&
Number.isFinite(localTime)&&
incomingTime<=localTime
)
return;

state={
...structuredClone(DEFAULT),
...incoming,
settings:{
...DEFAULT.settings,
...(incoming.settings||{})
}
};

saveLocal();

render();

setStatus(
'Sincronizado'
);

}
)
.subscribe(
status=>{
if(status==='SUBSCRIBED')
setStatus('Sincronizado');
}
);

}catch(e){

console.warn(
'No se pudo activar la sincronización en tiempo real.',
e
);

}

}

async function persist(){

if(
!currentCompanyId||
loading
)
return false;

const companyId=currentCompanyId;

const revision=localRevision;

const timestamp=
new Date().toISOString();

state.updatedAt=timestamp;

saveLocal();

const snapshot={
...structuredClone(state),
updatedAt:timestamp
};

const payload={
company_id:companyId,
data:snapshot
};

/*
Las escrituras se ponen en fila. Así, si haces
varios cambios seguidos, nunca una escritura
antigua pisa a una más nueva.
*/

persistChain=
persistChain
.catch(
()=>false
)
.then(
async()=>{

if(
companyId!==currentCompanyId
)
return false;

setStatus(
'Guardando…'
);

const {
error
}=
await sb
.from('company_app_data')
.upsert(
payload,
{
onConflict:'company_id'
}
);

if(error){

setStatus(
'Sin conexión · guardado local',
false
);

console.error(error);

return false;

}

setStatus(
'Sincronizado'
);

if(
localRevision===revision
)
localDirty=false;

return true;

}
);

return persistChain;

}

async function syncNow(){

if(!currentCompanyId)
return;

try{

await persist();

}catch(e){

setStatus(
'Sin conexión · guardado local',
false
);

console.error(e);

}

}

function updateCompanySelect(){

const s=
document.getElementById(
'companySelect'
);

s.innerHTML=
companies.map(
c=>
`
<option
value="${c.id}"
${c.id===currentCompanyId?'selected':''}>
${esc(
c.name||
('Empresa '+c.id.slice(0,6))
)}
</option>
`
).join('');

}

async function switchCompany(id){

if(
id===currentCompanyId
)
return;

await loadCompany(id);

localStorage.setItem(
'gemelitas_active_company',
currentCompanyId
);

}

async function createCompany(){

const name=
prompt(
'Nombre de la nueva empresa'
);

if(!name?.trim())
return;

const id=
crypto.randomUUID();

let r=
await sb
.from('companies')
.insert({

id,
name:name.trim()

});

if(r.error){

alert(
'No se pudo crear la empresa. Revisa que exista la tabla companies y sus permisos.'
);

console.error(r.error);

return;

}

r=
await sb
.from('company_members')
.insert({

company_id:id,
user_id:currentUser.id

});

if(r.error){

alert(
'La empresa se creó, pero no se pudo asignar al usuario.'
);

console.error(r.error);

return;

}

companies.push({

id,
name:name.trim()

});

currentCompanyId=id;

state=
structuredClone(DEFAULT);

state.settings.name=
name.trim();

loading=false;

try{

const {
error
}=
await sb
.from('company_app_data')
.upsert(
{
company_id:id,
data:{
...structuredClone(state),
updatedAt:new Date().toISOString()
}
},
{
onConflict:'company_id'
}
);

if(error)
throw error;

}catch(e){

console.error(e);

alert(
'La empresa se creó, pero no se pudo guardar su información inicial.'
);

return;

}

updateCompanySelect();

render();

}

async function initCompanies(){

const ids=
await getMemberships();

if(!ids.length){

throw new Error(
'Tu usuario no tiene ninguna empresa asignada en company_members.'
);

}

companies=
ids.map(
id=>({
id,
name:null
})
);

for(
const c of companies
){

const {
data
}=
await sb
.from('company_app_data')
.select('data')
.eq(
'company_id',
c.id
)
.maybeSingle();

c.name=
data?.data?.settings?.name||
null;

}

let cached=
localStorage.getItem(
'gemelitas_active_company'
);

currentCompanyId=
ids.includes(cached)
?cached
:ids[0];

await loadCompany(
currentCompanyId
);

localStorage.setItem(
'gemelitas_active_company',
currentCompanyId
);

}

async function loginUser(){

const email=
document
.getElementById('loginEmail')
.value
.trim();

const password=
document
.getElementById('loginPassword')
.value;

const message=
document.getElementById(
'loginMessage'
);

if(!email||!password){

message.textContent=
'Ingresa tu correo y contraseña.';

return;

}

message.textContent=
'Iniciando sesión…';

const {
data,
error
}=
await sb.auth.signInWithPassword({

email,
password

});

if(error){

message.textContent=
'Error: '+error.message;

return;

}

currentUser=data.user;

document.getElementById(
'loginScreen'
).style.display='none';

document.getElementById(
'app'
).style.display='block';

try{

await initCompanies();

}catch(e){

message.textContent=
e.message;

document.getElementById(
'loginScreen'
).style.display='flex';

document.getElementById(
'app'
).style.display='none';

console.error(e);

}

}

async function checkSession(){

const {
data
}=
await sb.auth.getSession();

if(data.session){

currentUser=
data.session.user;

document.getElementById(
'loginScreen'
).style.display='none';

document.getElementById(
'app'
).style.display='block';

try{

await initCompanies();

}catch(e){

document.getElementById(
'loginScreen'
).style.display='flex';

document.getElementById(
'app'
).style.display='none';

console.error(e);

}

}

}

async function logout(){

if(
!confirm(
'¿Cerrar sesión?'
)
)
return;

clearTimeout(saveTimer);

try{

if(currentCompanyId)
await persist();

}catch(e){

console.error(e);

}

if(realtimeChannel){

try{
await sb.removeChannel(realtimeChannel);
}catch(e){
console.warn(e);
}

realtimeChannel=null;

}

await sb.auth.signOut();

currentUser=null;

currentCompanyId=null;

companies=[];

document.getElementById(
'app'
).style.display='none';

document.getElementById(
'loginScreen'
).style.display='flex';

document.getElementById(
'loginPassword'
).value='';

document.getElementById(
'loginMessage'
).textContent=
'Sesión cerrada.';

}

function backup(){

let blob=
new Blob(
[
JSON.stringify(
{
version:2,
company_id:
currentCompanyId,
state
},
null,
2
)
],
{
type:'application/json'
}
);

let a=
document.createElement('a');

a.href=
URL.createObjectURL(blob);

a.download=
'Respaldo_GEMELITAS_'+
today()+
'.json';

a.click();

setTimeout(
()=>
URL.revokeObjectURL(a.href),
1000
);

}

function restoreFile(){

let i=
document.createElement('input');

i.type='file';

i.accept='.json';

i.onchange=
e=>{

let r=
new FileReader();

r.onload=
async()=>{

try{

let j=
JSON.parse(
r.result
);

if(j.state){

state={
...structuredClone(DEFAULT),
...j.state,
settings:{
...DEFAULT.settings,
...(j.state.settings||{})
}
};

}else{

state={
...structuredClone(DEFAULT),
...j
};

}

ensureWeek();

await persist();

render();

alert(
'Respaldo restaurado y sincronizado.'
);

}catch(err){

console.error(err);

alert(
'Archivo inválido.'
);

}

};

r.readAsText(
e.target.files[0]
);

};

i.click();

}
